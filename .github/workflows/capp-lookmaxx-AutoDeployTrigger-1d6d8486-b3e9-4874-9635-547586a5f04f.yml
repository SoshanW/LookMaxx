name: Trigger auto deployment for capp-lookmaxx

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/capp-lookmaxx-AutoDeployTrigger-1d6d8486-b3e9-4874-9635-547586a5f04f.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.CAPPLOOKMAXX_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}server
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: crlookmaxx.azurecr.io
          registryUsername: ${{ secrets.CAPPLOOKMAXX_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPPLOOKMAXX_REGISTRY_PASSWORD }}
          containerAppName: capp-lookmaxx
          resourceGroup: rg-lookmaxx
          imageToBuild: crlookmaxx.azurecr.io/capp-lookmaxx:${{ github.sha }}
          
            

     

